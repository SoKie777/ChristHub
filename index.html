<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06090d" />
    <meta name="description" content="Méditer des livres chrétiens, une portion par jour : lire, consolider, face au miroir, prier." />
    <link rel="icon" href="./icon.png" type="image/png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="ChristHub" />
    <title>ChristHub</title>
    <!-- GoatCounter: anonymous visit counts, no cookies. Opens of the Android app
         are counted under /android, the web version under /web. -->
    <script>
      window.goatcounter = {
        path: function (p) {
          return (location.hostname === "appassets.androidplatform.net" ? "/android" : "/web") + p;
        },
      };
    </script>
    <script data-goatcounter="https://christhub.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
